<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GENEAI — Genealogía con IA</title>
    <meta name="description" content="GENEAI: archivo familiar premium para construir tu árbol, investigar ancestros y preservar memoria con inteligencia artificial. Privado y seguro.">
    <meta name="author" content="GENEAI" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f3f5fb" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const appearance = localStorage.getItem('genai:appearance-v1') || 'system';
        const dark = appearance === 'dark' || (appearance === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#111723' : '#f3f5fb';
      } catch (_) {}
    </script>

    <!-- iOS standalone (Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GENEAI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GENEAI — Genealogía con IA">
    <meta property="og:description" content="Archivo familiar premium con árbol, IA genealógica, fotos, documentos y descubrimientos.">
    <meta property="og:image" content="/app-icon-512.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GENEAI — Genealogía con IA">
    <meta name="twitter:description" content="Archivo familiar premium e investigación genealógica con IA.">
    <meta name="twitter:image" content="/app-icon-512.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
