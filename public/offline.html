<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07101a" />
    <title>GENEAI sin conexión</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, rgba(20,184,166,.22), transparent 34%),
          linear-gradient(145deg, #07101a, #0d1720 58%, #101018);
        color: #f8fafc;
      }
      main {
        width: min(92vw, 520px);
        border: 1px solid rgba(148,163,184,.24);
        border-radius: 28px;
        padding: 28px;
        background: rgba(8,15,24,.78);
        box-shadow: 0 24px 80px rgba(0,0,0,.42);
      }
      img { width: 72px; height: 72px; object-fit: contain; display: block; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -.02em; }
      p { margin: 0 0 18px; color: #cbd5e1; line-height: 1.55; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: #22d3ee;
        color: #06111a;
        font-weight: 800;
        cursor: pointer;
      }
      .hint { margin-top: 18px; font-size: 13px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-sidebar.png" alt="GENEAI" />
      <h1>Sin conexión</h1>
      <p>GENEAI guardó partes esenciales de la app para que puedas seguir revisando información reciente. Cuando vuelva internet, sincronizará los cambios disponibles.</p>
      <button onclick="window.location.reload()">Reintentar</button>
      <p class="hint">Si estabas editando una ficha, vuelve a abrir la app cuando tengas conexión para confirmar el guardado.</p>
    </main>
  </body>
</html>
